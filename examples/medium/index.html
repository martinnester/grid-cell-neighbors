<!doctype html>
<html lang="en">
  <head>
    <title>Example Medium</title>
    <link rel="stylesheet" href="../../styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script lang="text/javascript" type="module" defer>
      //@ts-check
      import { View } from "../../src/view.js";
      import { AffinityGrid } from "../../src/main.js";
      const view = new View(
        /** @type {HTMLDivElement} */ (document.getElementById("root")),
      );
      view.appendChild(
        new AffinityGrid(
          document.title,
          Array.from({ length: 400 }).map((_) =>
            Array.from({ length: 400 }).map(
              (_) => Math.floor(Math.random() * Math.random() * 100) - 50,
            ),
          ),
          2,
        ),
      );
    </script>
  </body>
</html>
